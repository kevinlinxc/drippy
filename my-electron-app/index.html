<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' http://localhost:8501;"
    />
    <title>Drippy Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-in {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-in {
        animation: fade-in 0.2s ease, slide-in 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      const Send = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      );

      function DrippyChat() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const [todoList, setTodoList] = useState([]);
        const [currentStep, setCurrentStep] = useState(0);
        const [isProcessingStep, setIsProcessingStep] = useState(false);
        const [currentStepData, setCurrentStepData] = useState(null);
        const [isInitialized, setIsInitialized] = useState(false);
        const apiBaseUrl = 'http://localhost:8501';
        const messagesEndRef = useRef(null);

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages]);

        // Load todo list from file
        const loadTodoList = async () => {
          console.log('=== loadTodoList called ===');
          console.log('API URL:', `${apiBaseUrl}/todo-list`);
          try {
            const response = await fetch(`${apiBaseUrl}/todo-list`, {
              method: 'GET',
            });
            console.log('Response status:', response.status, response.statusText);
            if (response.ok) {
              const data = await response.json();
              console.log('Response data:', data);
              const todos = data.todo_list || [];
              console.log('Extracted todos:', todos);
              console.log('Number of todos:', todos.length);
              return todos;
            } else {
              const errorText = await response.text();
              console.error('API error response:', errorText);
            }
          } catch (err) {
            console.error('Error loading todo list:', err);
            console.error('Error details:', err.message, err.stack);
          }
          // Fallback: return empty array
          console.warn('Returning empty array as fallback');
          return [];
        };

        // Process next step
        const processNextStep = async () => {
          console.log('=== processNextStep called ===');
          console.log('State check:', { 
            currentStep, 
            todoListLength: todoList.length,
            todoList: todoList,
            isProcessingStep,
            isInitialized
          });
          
          if (todoList.length === 0) {
            console.error('ERROR: Todo list is empty!');
            setMessages((m) => [...m, {
              id: Date.now(),
              type: 'ai',
              content: '⚠️ Error: Todo list is empty'
            }]);
            return;
          }
          
          if (currentStep >= todoList.length) {
            console.log('All steps completed');
            setMessages((m) => [...m, {
              id: Date.now(),
              type: 'ai',
              content: '✅ All steps completed!'
            }]);
            return; // All steps completed
          }

          console.log(`Starting step ${currentStep + 1} of ${todoList.length}`);
          setIsProcessingStep(true);
          const todoItem = todoList[currentStep];
          console.log(`Processing step ${currentStep + 1}/${todoList.length}:`, todoItem);
          console.log('Todo item type:', typeof todoItem, 'Value:', todoItem);
          
          // Show step message
          setMessages((m) => [...m, {
            id: Date.now(),
            type: 'ai',
            content: `🔄 Step ${currentStep + 1}/${todoList.length}: ${todoItem}`
          }]);
          
          try {
            console.log('Calling API:', `${apiBaseUrl}/next_action`, { todo_list: todoItem });
            // Call the next_action API endpoint
            const response = await fetch(`${apiBaseUrl}/next_action`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ todo_list: todoItem })
            });

            console.log('API response status:', response.status);
            if (!response.ok) {
              const errorText = await response.text();
              console.error('API error response:', errorText);
              throw new Error(`API error: ${response.statusText} - ${errorText}`);
            }

            const data = await response.json();
            console.log('API response data:', data);
            setCurrentStepData({
              step: currentStep + 1,
              total: todoList.length,
              instructions: data.instructions,
              bbox: { x: data.x, y: data.y, width: data.width, height: data.height }
            });
          } catch (err) {
            console.error('Error processing step:', err);
            setMessages((m) => [...m, {
              id: Date.now(),
              type: 'ai',
              content: `⚠️ Error processing step ${currentStep + 1}: ${err.message}`
            }]);
          } finally {
            setIsProcessingStep(false);
          }
        };

        // Handle initial message
        const handleSend = async () => {
          if (!input.trim() || isInitialized) return;
          
          const userMessage = { id: Date.now(), type: 'user', content: input };
          setMessages((m) => [...m, userMessage]);
          setInput('');
          setIsTyping(true);

          // Show thinking message
          setTimeout(() => {
            setMessages((m) => [...m, {
              id: Date.now() + 1,
              type: 'ai',
              content: '🤔 Thinking...'
            }]);
          }, 100);

          try {
            // Load todo list
            console.log('Loading todo list...');
            const todos = await loadTodoList();
            console.log('Loaded todos:', todos);
            console.log('Number of todos:', todos.length);
            
            if (!todos || todos.length === 0) {
              console.error('No todos loaded!');
              setMessages((m) => [...m, {
                id: Date.now() + 1,
                type: 'ai',
                content: '⚠️ Error: No todo items found'
              }]);
              setIsTyping(false);
              return;
            }
            
            setTodoList(todos);
            setIsInitialized(true);
            console.log('Todo list set, initialized:', true);

            // Show todo list after a longer delay (3 seconds for thinking)
            setTimeout(() => {
              console.log('Displaying todo list in UI...');
              setMessages((m) => [...m, {
                id: Date.now() + 2,
                type: 'ai',
                content: `📋 Todo List:\n\n${todos.map((item, idx) => `${idx + 1}. ${item}`).join('\n')}`
              }]);
              setIsTyping(false);
              
              // Start processing first step after another delay
              console.log('Scheduling first step processing...');
              setTimeout(() => {
                console.log('About to call processNextStep for first step');
                console.log('Current state:', { currentStep, todoListLength: todos.length });
                processNextStep();
              }, 1000);
            }, 3000);
          } catch (err) {
            setMessages((m) => [...m, {
              id: Date.now() + 3,
              type: 'ai',
              content: '⚠️ Error: Could not load todo list.'
            }]);
            setIsTyping(false);
          }
        };

        // Handle Next button click
        const handleNext = () => {
          console.log('=== Next button clicked ===');
          console.log('Current state:', { 
            currentStep, 
            todoListLength: todoList.length,
            isLastStep: currentStep >= todoList.length - 1
          });
          
          if (currentStep < todoList.length - 1) {
            const nextStep = currentStep + 1;
            console.log(`Moving to next step: ${nextStep}`);
            setCurrentStep(nextStep);
            setCurrentStepData(null);
            // Process next step
            setTimeout(() => {
              console.log('Calling processNextStep from Next button');
              processNextStep();
            }, 300);
          } else {
            console.log('Already at last step, cannot go next');
          }
        };

        // Handle Done button click
        const handleDone = () => {
          setMessages((m) => [...m, {
            id: Date.now(),
            type: 'ai',
            content: '✅ All steps completed!'
          }]);
          setCurrentStepData(null);
          setIsInitialized(false);
          setCurrentStep(0);
        };

        const handleKey = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        };

        return (
          <div className="flex flex-col h-screen bg-transparent text-gray-900">
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg) => (
                <div key={msg.id} className={`flex gap-3 ${msg.type === 'user' ? 'justify-end' : 'justify-start'} animate-in`}>
                  <div className={`px-4 py-2 rounded-2xl max-w-[80%] whitespace-pre-wrap ${msg.type === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'} shadow-sm`}>
                    {msg.content}
                  </div>
                </div>
              ))}
              
              {isTyping && (
                <div className="flex gap-3 animate-in">
                  <div className="px-4 py-2 rounded-2xl bg-white border border-gray-200 flex gap-1">
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                  </div>
                </div>
              )}

              {currentStepData && (
                <div className="flex gap-3 justify-start animate-in">
                  <div className="px-4 py-3 rounded-2xl bg-white border border-gray-200 shadow-sm max-w-[80%]">
                    <div className="text-sm font-semibold text-gray-600 mb-2">
                      Step {currentStepData.step} of {currentStepData.total}
                    </div>
                    <div className="text-gray-800 mb-3">
                      {currentStepData.instructions}
                    </div>
                    <div className="flex gap-2">
                      {currentStep < todoList.length - 1 ? (
                        <button
                          onClick={handleNext}
                          disabled={isProcessingStep}
                          className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                        >
                          Next
                        </button>
                      ) : (
                        <button
                          onClick={handleDone}
                          disabled={isProcessingStep}
                          className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
                        >
                          Done
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {isProcessingStep && (
                <div className="flex gap-3 justify-start animate-in">
                  <div className="px-4 py-2 rounded-2xl bg-white border border-gray-200 flex gap-1">
                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                    <span className="ml-2 text-sm text-gray-600">Processing step {currentStep + 1}...</span>
                  </div>
                </div>
              )}

              <div ref={messagesEndRef}></div>
            </div>

            <div className="p-4 bg-white/70 backdrop-blur-xl border-t border-gray-200">
              <div className="max-w-3xl mx-auto flex gap-3 items-center bg-gray-50 rounded-2xl p-2 shadow-lg">
                <textarea
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={handleKey}
                  placeholder={isInitialized ? "Workflow in progress..." : "Type any message to start..."}
                  rows="1"
                  disabled={isInitialized}
                  className={`flex-1 bg-transparent resize-none px-3 py-2 focus:outline-none ${isInitialized ? 'opacity-50 cursor-not-allowed' : ''}`}
                />
                <button
                  onClick={handleSend}
                  disabled={!input.trim() || isInitialized}
                  className={`p-3 rounded-xl ${input.trim() && !isInitialized ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}`}
                >
                  <Send />
                </button>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<DrippyChat />, document.getElementById('root'));
    </script>
  </body>
</html>
