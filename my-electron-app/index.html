<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' http://localhost:8000;"
    />
    <title>Drippy Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slide-in {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-in {
        animation: fade-in 0.2s ease, slide-in 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      const Send = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
          <path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
        </svg>
      );

      function DrippyChat() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const apiBaseUrl = 'http://localhost:8000';
        const messagesEndRef = useRef(null);

        useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages]);

        const handleSend = async () => {
          if (!input.trim()) return;
          const userMessage = { id: Date.now(), type: 'user', content: input };
          setMessages((m) => [...m, userMessage]);
          setInput('');
          setIsTyping(true);

          try {
            const res = await fetch(`${apiBaseUrl}/process_task`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ task: input.trim() })
            });
            const data = await res.json();

            await fetch(`${apiBaseUrl}/show_overlay`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                x: data.x, y: data.y,
                width: data.width, height: data.height,
                text: data.instructions,
              }),
            });

            const aiMsg = {
              id: Date.now() + 1,
              type: 'ai',
              content: data.instructions || 'Overlay active — follow the highlighted guide.'
            };
            setMessages((m) => [...m, aiMsg]);
          } catch (err) {
            setMessages((m) => [...m, {
              id: Date.now() + 2,
              type: 'ai',
              content: '⚠️ Error: Backend not responding.'
            }]);
          } finally {
            setIsTyping(false);
          }
        };

        const handleKey = (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
          }
        };

        return (
          <div className="flex flex-col h-screen bg-transparent text-gray-900">
            <div className="flex-1 overflow-y-auto p-4 space-y-4">
              {messages.map((msg) => (
                <div key={msg.id} className={`flex gap-3 ${msg.type === 'user' ? 'justify-end' : 'justify-start'} animate-in`}>
                  <div className={`px-4 py-2 rounded-2xl ${msg.type === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border border-gray-200'} shadow-sm`}>
                    {msg.content}
                  </div>
                </div>
              ))}
              {isTyping && (
                <div className="flex gap-3 animate-in">
                  <div className="px-4 py-2 rounded-2xl bg-white border border-gray-200 flex gap-1">
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                  </div>
                </div>
              )}
              <div ref={messagesEndRef}></div>
            </div>

            <div className="p-4 bg-white/70 backdrop-blur-xl border-t border-gray-200">
              <div className="max-w-3xl mx-auto flex gap-3 items-center bg-gray-50 rounded-2xl p-2 shadow-lg">
                <textarea
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={handleKey}
                  placeholder="Ask Drippy..."
                  rows="1"
                  className="flex-1 bg-transparent resize-none px-3 py-2 focus:outline-none"
                />
                <button
                  onClick={handleSend}
                  disabled={!input.trim()}
                  className={`p-3 rounded-xl ${input.trim() ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-300 text-gray-500'}`}
                >
                  <Send />
                </button>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.render(<DrippyChat />, document.getElementById('root'));
    </script>
  </body>
</html>
